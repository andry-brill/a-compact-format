name: any_compact_format
description: Compact number formatting for Flutter with exact decimal scaling, customizable locales, scientific notation, file sizes, and metric units.
version: 1.0.0
repository: https://github.com/andry-brill/a-compact-format
environment:
  sdk: '>=3.13.7 <4.0.0'
  flutter: '>=3.47.9'
dependencies:
  flutter:
    sdk: flutter
  intl: ^0.20.3
  decimal: ^3.2.6
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
